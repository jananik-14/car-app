name: wheels2drive
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^13.2.0
  dio: ^5.4.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  share_plus: any
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  file_picker: ^8.1.4
  syncfusion_flutter_pdfviewer: any
  qr_flutter: 4.1.0
  url_launcher: ^6.2.6
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
