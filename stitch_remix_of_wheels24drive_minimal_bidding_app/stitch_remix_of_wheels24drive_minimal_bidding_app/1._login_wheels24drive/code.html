flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">
<!-- Subtle Ambient Top Glow for Delight & Modern Fintech Depth -->
<div class="relative w-full overflow-hidden pointer-events-none -mb-16 opacity-70">
<div class="w-72 h-44 mx-auto rounded-full bg-surface-container-high blur-3xl"></div>
</div>
<!-- Header / Brand Section -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-3xl relative z-10"><div class="relative flex flex-col items-center justify-center pt-2 pb-2 w-full"><div class="bg-surface-container-lowest rounded-2xl p-4 shadow-sm border border-surface-container-highest/60 flex items-center justify-center max-w-[260px] w-full mx-auto"><img alt="Wheels 2 Drive Logo" class="w-full h-auto object-contain mx-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCs7FhKDjG036Fzl1rHHjIMaILD8RD5-JEoiFaZK3F6PBCFWboZZKBG8_xiwrxwXrITIFQaV-8GywZZB1ReubSt2S7hFHcrjN_94vamg2QPcMY2ZscSP1LuvfsLxxKkPRPa65uPOXReQpIF7KEQ_1q41aHdlONkK8pM8tPVChAMg6enIYGUc4JBu9LUC1Zm1STe8fcAOPkkgRoxdR3GadQIOMboCaJTMtpRIjRXRORbUSmSqzL97Yr6BvKOz3HV7qKMlw"></div></div></div>
<!-- Main Interaction Card (Elevated Soft Canvas) -->
<div class="w-full max-w-md mx-auto flex flex-col gap-space-2xl relative z-10"><div class="flex flex-col gap-1.5 text-left">
  <h1 class="text-[20px] leading-tight text-on-surface font-bold tracking-tight">
    Enter your Mobile Number
  </h1>
  
</div>

<div class="flex flex-col gap-2">
  <label class="font-label-md text-label-md text-on-surface font-semibold px-1" for="mobile-input">
    Mobile Number
  </label>
  <div class="flex items-center h-14 w-full bg-surface-container-lowest rounded-2xl border border-surface-container-highest/60 shadow-sm px-3.5 transition-all duration-200 focus-within:border-primary focus-within:shadow-md" id="input-wrapper">
    <div class="flex items-center gap-1.5 bg-surface-container-low/80 px-2.5 py-1.5 rounded-xl select-none shrink-0">
      <svg aria-label="India Flag" class="w-5 h-3.5 rounded-xs overflow-hidden shadow-xs shrink-0" viewBox="0 0 900 600">
        <rect fill="#FF9933" height="200" width="900"></rect>
        <rect fill="#FFFFFF" height="200" width="900" y="200"></rect>
        <rect fill="#128807" height="200" width="900" y="400"></rect>
        <circle cx="450" cy="300" fill="none" r="80" stroke="#000080" stroke-width="12"></circle>
        <circle cx="450" cy="300" fill="#000080" r="16"></circle>
      </svg>
      <span class="font-label-lg text-label-lg text-on-surface font-bold tracking-tight">
        +91
      </span>
    </div>
    <div class="h-6 w-[1.5px] bg-surface-container mx-3 shrink-0"></div>
    <input autocomplete="tel-national" class="flex-1 min-w-0 bg-transparent text-[18px] text-on-surface placeholder:text-outline-variant font-bold tracking-wider outline-none" id="mobile-input" inputmode="numeric" maxlength="11" pattern="[0-9]*" placeholder="98765 43210" type="tel">
    <button aria-label="Clear field" class="hidden w-8 h-8 items-center justify-center rounded-full bg-surface-container-low text-on-surface-variant transition-transform active:scale-90" id="clear-btn" type="button">
      <span class="material-symbols-outlined text-[18px]">close</span>
    </button>
  </div>
  <div class="flex items-center gap-1 px-1 mt-0.5 text-on-surface-variant">
    
    
  </div>
</div>

<div class="flex flex-col gap-space-md pt-2">
  <button class="w-full h-14 rounded-2xl bg-secondary-container text-on-primary font-label-lg text-label-lg font-bold shadow-md shadow-secondary-container/25 flex items-center justify-center gap-2 transition-all duration-200 active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none" id="otp-btn" type="button">
    <span class="">Get OTP</span>
    <span class="material-symbols-outlined text-[20px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
  </button>
  <div class="flex items-center justify-center gap-4 pt-1 text-on-surface-variant">
    <div class="flex items-center gap-1">
      <span class="material-symbols-outlined text-[15px] text-secondary-container">flash_on</span>
      <span class="text-[11px] font-semibold">Instant Access</span>
    </div>
    <div class="w-1 h-1 rounded-full bg-surface-container-highest"></div>
    <div class="flex items-center gap-1">
      <span class="material-symbols-outlined text-[15px] text-secondary-container">shield</span>
      <span class="text-[11px] font-semibold">Zero Spam</span>
    </div>
    <div class="w-1 h-1 rounded-full bg-surface-container-highest"></div>
    <div class="flex items-center gap-1">
      <span class="material-symbols-outlined text-[15px] text-secondary-container">gavel</span>
      <span class="text-[11px] font-semibold">Verified Auctions</span>
    </div>
  </div>
</div>

<div class="mt-4 text-center px-space-md">
  <p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
    By continuing, you agree to our
    <a class="font-label-md text-label-md text-primary font-bold underline decoration-primary/40 underline-offset-2 hover:decoration-primary" href="#terms">
      Terms of Service
    </a>
    &amp;
    <a class="font-label-md text-label-md text-primary font-bold underline decoration-primary/40 underline-offset-2 hover:decoration-primary" href="#privacy">
      Privacy Policy
    </a>
  </p>
</div></div>
</div>
<script>
  (function() {
    const input = document.getElementById('mobile-input');
    const inputWrapper = document.getElementById('input-wrapper');
    const clearBtn = document.getElementById('clear-btn');
    const otpBtn = document.getElementById('otp-btn');

    if (!input || !inputWrapper || !clearBtn || !otpBtn) return;

    // Formatting as user types (Indian 5-5 format: "98765 43210")
    input.addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length > 10) value = value.slice(0, 10);
      
      let formatted = value;
      if (value.length > 5) {
        formatted = value.slice(0, 5) + ' ' + value.slice(5);
      }
      e.target.value = formatted;

      // Toggle clear button
      if (value.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
      }

      // Check valid 10-digit mobile number
      if (value.length === 10) {
        inputWrapper.classList.add('bg-surface-container-lowest');
        inputWrapper.classList.add('shadow-md');
      }
    });

    // Clear field action
    clearBtn.addEventListener('click', function() {
      input.value = '';
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
      input.focus();
    });

    // Tap pulse delight feedback on primary CTA
    otpBtn.addEventListener('click', function() {
      const rawVal = input.value.replace(/\D/g, '');
      if (rawVal.length < 10) {
        inputWrapper.classList.add('animate-shake');
        input.focus();
        setTimeout(() => inputWrapper.classList.remove('animate-shake'), 400);
      }
    });
  })();
</script></main>
