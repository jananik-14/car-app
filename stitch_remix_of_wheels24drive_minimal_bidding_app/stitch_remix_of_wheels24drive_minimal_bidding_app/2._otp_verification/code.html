<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

n-background": "#0b1c30" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-2xl": "2rem", "gutter-tablet": "1rem", "space-2xs": "0.25rem", "space-sm": "0.75rem", "margin-tablet": "1.5rem", "space-md": "1rem", "space-3xl": "2.5rem", "space-4xl": "3rem", "space-xs": "0.5rem", "space-lg": "1.25rem", "margin-mobile": "1rem", "space-xl": "1.5rem", "gutter-mobile": "0.75rem" }, "fontFamily": { "body-md": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "display-lg-mobile": ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "700" }], "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.015em", "fontWeight": "700" }], "display-lg-mobile": ["30px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "label-lg": ["15px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);

  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">
<!-- Minimal Top Navigation -->
<div class="flex items-center justify-between py-space-md">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low text-on-surface hover:bg-surface-container active:scale-95 transition-all shadow-sm" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface text-center">Verify Phone</h1>
<div aria-hidden="true" class="w-10 h-10"></div>
</div>
<!-- Main Verification Context -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-2xl">
<!-- Trust shield badge -->
<div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-primary-fixed text-on-primary-fixed mb-space-md shadow-sm">
<span class="material-symbols-outlined text-[24px]">verified_user</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs">
      Enter the 4-digit code sent to
    </p>
<!-- Phone Number Pill with Change Action -->
<div class="inline-flex items-center gap-space-xs mt-space-xs px-space-md py-space-xs rounded-full bg-surface-container-low shadow-sm">
<span class="font-label-lg text-label-lg text-on-surface tracking-wide">+91 98765 43210</span>
<button class="inline-flex items-center gap-0.5 text-secondary font-label-md text-label-md active:opacity-75 transition-opacity pl-space-xs" type="button">
<span>Change</span>
<span class="material-symbols-outlined text-[16px]">edit</span>
</button>
</div>
</div>
<!-- OTP Inputs Container -->
<div class="flex justify-center items-center gap-space-sm sm:gap-space-md my-space-lg">
<!-- Digit 1 -->
<div class="flex items-center justify-center w-16 h-18 rounded-xl bg-surface-container-lowest shadow-md transition-transform hover:scale-105">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface select-none">4</span>
</div>
<!-- Digit 2 -->
<div class="flex items-center justify-center w-16 h-18 rounded-xl bg-surface-container-lowest shadow-md transition-transform hover:scale-105">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface select-none">8</span>
</div>
<!-- Digit 3 -->
<div class="flex items-center justify-center w-16 h-18 rounded-xl bg-surface-container-lowest shadow-md transition-transform hover:scale-105">
<span class="font-display-lg-mobile text-display-lg-mobile text-on-surface select-none">2</span>
</div>
<!-- Digit 4 (Active / Focused State) -->
<div class="relative flex items-center justify-center w-16 h-18 rounded-xl bg-surface-container-lowest shadow-xl ring-2 ring-secondary-container transition-transform scale-105">
<span class="inline-block w-0.5 h-7 bg-secondary-container rounded-full animate-pulse"></span>
</div>
</div>
<!-- Instant Verification Feedback Indicator -->
<div class="flex items-center justify-center gap-space-xs mt-space-xs mb-space-2xl text-on-surface-variant">
<span class="inline-block w-2 h-2 rounded-full bg-secondary-container"></span>
<span class="font-label-sm text-label-sm tracking-wide uppercase">Auto-verifying on 4th digit</span>
</div>
<!-- Primary Verification Action Button -->
<div class="w-full mt-space-md">
<button class="w-full h-14 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all" type="button">
<span>Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Resend Timer Context -->
<div class="flex flex-col items-center justify-center mt-space-xl text-center">
<div class="inline-flex items-center gap-space-xs py-space-xs px-space-md rounded-full bg-surface-container">
<span class="material-symbols-outlined text-on-surface-variant text-[16px]">timer</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">
        Resend code in <strong class="font-label-sm text-label-sm text-on-surface font-semibold" id="countdown">24s</strong>
</span>
</div>
<button class="mt-space-sm font-label-md text-label-md text-on-surface-variant opacity-60 pointer-events-none transition-opacity" id="resend-btn" type="button">
      Didn't get the code? <span class="text-secondary underline underline-offset-4">Resend via SMS</span>
</button>
</div>
</div>
<script>
  (function() {
    let timeLeft = 24;
    const countdownEl = document.getElementById('countdown');
    const resendBtn = document.getElementById('resend-btn');

    if (countdownEl && resendBtn) {
      const timer = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft > 0) {
          countdownEl.textContent = timeLeft + 's';
        } else {
          clearInterval(timer);
          countdownEl.parentElement.classList.add('hidden');
          resendBtn.classList.remove('opacity-60', 'pointer-events-none');
          resendBtn.classList.add('opacity-100');
        }
      }, 1000);
    }
  })();
</script></main></body></html>
