    body {
      min-height: max(884px, 100dvh);

  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile">
<div class="flex items-center justify-between py-space-sm"><button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low text-on-surface active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined text-headline-sm">arrow_back</span>
</button>
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDP9VtMkkWB6M0MwMeSsicxW9tIL1WWH4VjGYwjRrJk6VTJNeGR5lHRkKJPBICJL9QYQEgeiPtMRocf7_L6ToUmyCRnhHONc7Wl4BZ8hB4cGTp8v7etO_FXQr5vYir9Lte-lsLQ5OQACVSH1WlCSKEEdu0e8H8lbDECqUuabhKPQZfzImWU_T58MdkqjuNDSWEZ2aW1bhepnsVVBIcif_xsCQxLuCRTZnoa5OopMKJxZJ2wFWQg-yEQ7diL-syG3YS_kA" alt="Wheels 2 Drive" class="h-8 w-auto object-contain">
<div class="flex items-center gap-space-xs px-space-sm py-1 rounded-full bg-surface-container-high text-primary-container">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Verified Secure</span>
</div></div>
<div class="mt-space-2xl mb-space-3xl">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-secondary-fixed text-on-secondary-fixed mb-space-lg shadow-sm">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mark_email_read</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">
      What's your Email?
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs max-w-xs">
      Receive official bid invoices and vehicle RC transfer documents.
    </p>
</div>
<form class="flex flex-col gap-space-xl" id="emailForm" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<div class="relative flex items-center w-full">
<div class="absolute left-space-md flex items-center pointer-events-none text-on-surface-variant transition-colors duration-200" id="iconWrapper">
<span class="material-symbols-outlined text-headline-sm">mail</span>
</div>
<input autocomplete="email" class="w-full h-14 pl-12 pr-12 rounded-xl bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm placeholder:text-outline-variant shadow-sm transition-all duration-200 outline-none" id="emailInput" inputmode="email" placeholder="name@example.com" type="email">
<button aria-label="Clear input" class="hidden absolute right-space-md items-center justify-center w-8 h-8 rounded-full bg-surface-container text-on-surface-variant active:scale-90 transition-all duration-150" id="clearBtn" type="button">
<span class="material-symbols-outlined text-body-md">close</span>
</button>
</div>
<div class="h-5 px-space-xs flex items-center gap-space-2xs text-secondary opacity-0 transition-opacity duration-200" id="validationHint">
<span class="material-symbols-outlined text-label-sm">info</span>
<span class="font-label-sm text-label-sm">Please enter a valid official email address</span>
</div>
</div>
<button class="w-full h-14 rounded-xl bg-secondary-container text-on-primary font-label-lg text-label-lg shadow-md flex items-center justify-center gap-space-xs active:scale-[0.98] transition-all duration-150 disabled:opacity-50 disabled:pointer-events-none" id="submitBtn" type="submit">
<span class="">Save Email</span>
<span class="material-symbols-outlined text-headline-sm">arrow_forward</span>
</button>
</form>
<div class="mt-space-4xl flex flex-col items-center justify-center text-center">
<div class="flex items-center gap-space-xs text-on-surface-variant">
<span class="material-symbols-outlined text-body-md">lock</span>
<span class="font-label-md text-label-md">256-bit encrypted bidder profile</span>
</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('emailInput');
    const clearBtn = document.getElementById('clearBtn');
    const submitBtn = document.getElementById('submitBtn');
    const icon = document.getElementById('iconWrapper');
    const hint = document.getElementById('validationHint');

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    input.addEventListener('input', () => {
      const val = input.value.trim();
      if (val.length > 0) {
        clearBtn.classList.remove('hidden');
        clearBtn.classList.add('flex');
      } else {
        clearBtn.classList.add('hidden');
        clearBtn.classList.remove('flex');
        hint.classList.add('opacity-0');
      }
    });

    input.addEventListener('focus', () => {
      icon.classList.remove('text-on-surface-variant');
      icon.classList.add('text-secondary-container');
    });

    input.addEventListener('blur', () => {
      icon.classList.remove('text-secondary-container');
      icon.classList.add('text-on-surface-variant');
      const val = input.value.trim();
      if (val.length > 0 && !emailPattern.test(val)) {
        hint.classList.remove('opacity-0');
      } else {
        hint.classList.add('opacity-0');
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.classList.add('hidden');
      clearBtn.classList.remove('flex');
      hint.classList.add('opacity-0');
      input.focus();
    });

    document.getElementById('emailForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!emailPattern.test(val)) {
        hint.classList.remove('opacity-0');
        input.focus();
      } else {
        submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-headline-sm">progress_activity</span>';
        setTimeout(() => {
          submitBtn.innerHTML = '<span class="material-symbols-outlined text-headline-sm">check</span><span>Saved</span>';
        }, 700);
      }
    });
  })();
</script></main>

</body></html>
